name: Anddea Beta Patch → ARM64 Release

on:
  workflow_dispatch:
    inputs:
      youtube_version:
        description: "YouTube version"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "21.38.123"
          - "21.37.42"
          - "21.28.208"
          - "21.16.256"
          - "21.13.164"
          - "20.31.42"
          - "20.21.37"

      include_experimental:
        description: "Include Experimental YouTube versions"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APKMD_REPO: "tanishqmanuja/apkmirror-downloader"
      MORPHE_REPO: "MorpheApp/morphe-desktop"
      PATCHES_REPO: "https://github.com/anddea/revanced-patches"

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Java 21
      # -------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # -------------------------------------------------------
      # Download APKMirror downloader
      # -------------------------------------------------------
      - name: Download APKMirror downloader
        shell: bash
        run: |
          set -e

          mkdir -p tools downloads

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          APKMD_URL="$(
            curl -fsSL "$API" |
            jq -r '.assets[]
              | select(.name == "apkmd")
              | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "ERROR: APKMD binary not found."

            echo "Available assets:"
            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "Downloading APKMD:"
          echo "$APKMD_URL"

          curl -fL "$APKMD_URL" \
            -o tools/apkmd

          chmod +x tools/apkmd

          echo "APKMD:"
          ./tools/apkmd --help

      # -------------------------------------------------------
      # Download Morphe Desktop
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/${MORPHE_REPO}/releases/latest"

          MORPHE_URL="$(
            curl -fsSL "$API" |
            jq -r '.assets[]
              | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$MORPHE_URL" ] || [ "$MORPHE_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop JAR not found."

            echo "Available assets:"
            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "Downloading Morphe Desktop:"
          echo "$MORPHE_URL"

          curl -fL "$MORPHE_URL" \
            -o tools/morphe-desktop.jar

          echo "Morphe Desktop:"
          ls -lh tools/morphe-desktop.jar

      # -------------------------------------------------------
      # Select YouTube version
      # -------------------------------------------------------
      - name: Select YouTube version
        shell: bash
        env:
          SELECTED_VERSION: ${{ inputs.youtube_version }}
          INCLUDE_EXPERIMENTAL: ${{ inputs.include_experimental }}
        run: |
          set -e

          echo "Selected option: $SELECTED_VERSION"
          echo "Include experimental: $INCLUDE_EXPERIMENTAL"

          # ---------------------------------------------------
          # Manual version
          # ---------------------------------------------------
          if [ "$SELECTED_VERSION" != "latest" ]; then

            YT_VERSION="$SELECTED_VERSION"

            echo ""
            echo "========================================="
            echo "Manual YouTube version:"
            echo "$YT_VERSION"
            echo "========================================="

            echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"

          else

            # -------------------------------------------------
            # Automatically detect latest Anddea-compatible
            # YouTube version
            # -------------------------------------------------

            echo ""
            echo "Detecting Anddea Beta YouTube versions..."

            if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then

              java -jar tools/morphe-desktop.jar \
                list-versions \
                --patches "$PATCHES_REPO" \
                --prerelease \
                --include-experimental \
                -f com.google.android.youtube \
                | tee anddea-versions.txt

            else

              java -jar tools/morphe-desktop.jar \
                list-versions \
                --patches "$PATCHES_REPO" \
                --prerelease \
                -f com.google.android.youtube \
                | tee anddea-versions.txt

            fi

            echo ""
            echo "Anddea Beta output:"
            cat anddea-versions.txt

            YT_VERSION="$(
              grep -oE '[0-9]+\.[0-9]+\.[0-9]+' anddea-versions.txt |
              head -n 1
            )"

            if [ -z "$YT_VERSION" ]; then
              echo "ERROR: Could not detect YouTube version from Anddea."
              exit 1
            fi

            echo ""
            echo "========================================="
            echo "Automatically selected:"
            echo "$YT_VERSION"
            echo "========================================="

            echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"

          fi

      # -------------------------------------------------------
      # Detect Latest Anddea DEV Patch Version
      # -------------------------------------------------------
      - name: Detect Anddea Patch Version
        shell: bash
        run: |
          set -e

          echo "Detecting latest Anddea DEV patch..."

          PATCH_VERSION="$(
            curl -fsSL \
              "https://api.github.com/repos/anddea/revanced-patches/releases?per_page=30" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$"))
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$PATCH_VERSION" ] || [ "$PATCH_VERSION" = "null" ]; then
            echo "ERROR: Could not detect latest Anddea DEV patch."
            exit 1
          fi

          PATCH_VERSION="${PATCH_VERSION#v}"

          echo ""
          echo "========================================="
          echo "Latest Anddea DEV Patch:"
          echo "$PATCH_VERSION"
          echo "========================================="

          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Confirm selected version
      # -------------------------------------------------------
      - name: Confirm YouTube version
        shell: bash
        run: |
          set -e

          if [ -z "$YT_VERSION" ]; then
            echo "ERROR: YT_VERSION is empty."
            exit 1
          fi

          echo "YouTube version selected:"
          echo "$YT_VERSION"

          echo "Anddea DEV patch version:"
          echo "$PATCH_VERSION"

      # -------------------------------------------------------
      # Download YouTube from APKMirror
      # -------------------------------------------------------
      - name: Download YouTube from APKMirror
        shell: bash
        run: |
          set -e

          rm -rf downloads
          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "youtube-${YT_VERSION}"
              }
            ]
          }
          EOF

          echo "APKMD configuration:"
          cat apps.json

          echo ""
          echo "Downloading YouTube ${YT_VERSION}..."

          ./tools/apkmd apps.json

          echo ""
          echo "Downloaded files:"
          find downloads -type f -print

          APK="$(
            find downloads \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK was not downloaded."
            exit 1
          fi

          cp "$APK" youtube-original.apk

          echo ""
          echo "Original YouTube APK:"
          ls -lh youtube-original.apk

      # -------------------------------------------------------
      # Optimize / align APK
      # -------------------------------------------------------
      - name: Optimize APK with Zipalign
        shell: bash
        run: |
          set -e

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "zipalign" |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          echo "Using zipalign:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            youtube-original.apk \
            youtube-aligned.apk

          echo ""
          echo "Checking alignment..."

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            youtube-aligned.apk

          echo ""
          echo "Aligned APK:"
          ls -lh youtube-aligned.apk

      # -------------------------------------------------------
      # Patch with Anddea Beta patches
      # -------------------------------------------------------
      - name: Patch YouTube with Anddea Beta
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Starting Anddea Beta patch"
          echo "YouTube: ${YT_VERSION}"
          echo "Patches: ${PATCH_VERSION}"
          echo "========================================="

          FINAL_APK="YT-${YT_VERSION}-Anddea-Beta-Patches-${PATCH_VERSION}.apk"

          java -jar tools/morphe-desktop.jar \
            patch \
            -p "$PATCHES_REPO" \
            --prerelease \
            -o "$FINAL_APK" \
            -r "result.json" \
            --striplibs "arm64-v8a" \
            --bytecode-mode "STRIP_SAFE" \
            youtube-aligned.apk

          if [ ! -f "$FINAL_APK" ]; then
            echo "ERROR: Anddea Beta APK was not created."
            exit 1
          fi

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "========================================="
          echo "Anddea Beta patch successful"
          echo "========================================="

          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Verify final APK
      # -------------------------------------------------------
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          APK="$FINAL_APK"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK not found."
            exit 1
          fi

          echo "Final APK:"
          ls -lh "$APK"

          echo ""
          echo "APK information:"
          file "$APK"

      # -------------------------------------------------------
      # Upload APK artifact
      # -------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-${{ env.YT_VERSION }}-Anddea-Beta-Patches-${{ env.PATCH_VERSION }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error

      # -------------------------------------------------------
      # Upload Anddea result
      # -------------------------------------------------------
      - name: Upload Anddea patch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anddea-result-${{ env.YT_VERSION }}-${{ env.PATCH_VERSION }}
          path: result.json
          if-no-files-found: warn

      # -------------------------------------------------------
      # Create GitHub Release
      # -------------------------------------------------------
      - name: Create GitHub Anddea Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ env.YT_VERSION }}-anddea-beta-${{ env.PATCH_VERSION }}
          name: YT ${{ env.YT_VERSION }} Anddea Beta - Patches ${{ env.PATCH_VERSION }}

          # NORMAL RELEASE
          prerelease: false

          body: |
            YouTube ${{ env.YT_VERSION }}

            Patched with Anddea Beta patches.

            Anddea DEV Patches:
            ${{ env.PATCH_VERSION }}

            Architecture:
            ARM64-v8a

            Optimized:
            Yes

            Zipaligned:
            Yes

            Source:
            APKMirror

            Build:
            Anddea Beta

          files: |
            ${{ env.FINAL_APK }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
