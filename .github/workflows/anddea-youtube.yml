name: YouTube 21.13.164 → Anddea DEV → ARM64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      YT_VERSION: "21.13.164"
      APKMD_REPO: "tanishqmanuja/apkmirror-downloader"
      CLI_REPO: "ReVanced/revanced-cli"
      ANDDEA_REPO: "anddea/revanced-patches"

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 21
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # --------------------------------------------------
      # 3. Download APKMirror downloader
      # --------------------------------------------------
      - name: Download APKMirror downloader
        shell: bash
        run: |
          set -e

          mkdir -p tools downloads

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          APKMD_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(.name == "apkmd")
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "ERROR: APKMD binary not found."
            curl -fsSL "$API" | jq -r '.assets[].name'
            exit 1
          fi

          curl -fL "$APKMD_URL" -o tools/apkmd
          chmod +x tools/apkmd

          ./tools/apkmd --help


      # --------------------------------------------------
      # 4. Download latest ReVanced CLI
      # --------------------------------------------------
      - name: Download ReVanced CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/${CLI_REPO}/releases/latest"

          CLI_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(.name | test("revanced-cli-.*-all\\.jar$"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$CLI_URL" ] || [ "$CLI_URL" = "null" ]; then
            echo "ERROR: ReVanced CLI JAR not found."
            curl -fsSL "$API" | jq -r '.assets[].name'
            exit 1
          fi

          curl -fL "$CLI_URL" -o tools/revanced-cli.jar

          ls -lh tools/revanced-cli.jar


      # --------------------------------------------------
      # 5. Download latest Anddea DEV patch bundle
      # --------------------------------------------------
      - name: Download Anddea DEV patches
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/${ANDDEA_REPO}/releases"

          ANDDEA_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .[]
              | select(.prerelease == true)
              | .assets[]
              | select(.name | test("^patches-.*\\.mpp$"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$ANDDEA_URL" ] || [ "$ANDDEA_URL" = "null" ]; then
            echo "ERROR: Anddea DEV .mpp patch bundle not found."
            exit 1
          fi

          echo "Downloading:"
          echo "$ANDDEA_URL"

          curl -fL "$ANDDEA_URL" -o tools/anddea-dev.mpp

          ls -lh tools/anddea-dev.mpp


      # --------------------------------------------------
      # 6. Show compatible patches for YouTube 21.13.164
      # --------------------------------------------------
      - name: Check Anddea compatibility
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "YouTube version: ${YT_VERSION}"
          echo "Anddea DEV patch bundle:"
          echo "=========================================="

          java -jar tools/revanced-cli.jar \
            list-patches \
            -b \
            -p tools/anddea-dev.mpp \
            --packages \
            --versions \
            | tee compatible-patches.txt

          echo ""
          echo "=========================================="
          echo "Checking YouTube 21.13.164"
          echo "=========================================="

          if grep -F "21.13.164" compatible-patches.txt; then
            echo "21.13.164 appears in the patch compatibility data."
          else
            echo "WARNING: 21.13.164 was not found in the listed compatibility data."
            echo "Patch step will determine actual compatibility."
          fi


      # --------------------------------------------------
      # 7. Download YouTube 21.13.164 from APKMirror
      # --------------------------------------------------
      - name: Download YouTube 21.13.164
        shell: bash
        run: |
          set -e

          rm -rf downloads
          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "youtube-${YT_VERSION}"
              }
            ]
          }
          EOF

          ./tools/apkmd apps.json

          APK="$(
            find downloads \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK was not downloaded."
            find downloads -type f -maxdepth 3 || true
            exit 1
          fi

          cp "$APK" youtube-original.apk

          echo "Downloaded APK:"
          ls -lh youtube-original.apk


      # --------------------------------------------------
      # 8. Zipalign original APK
      # --------------------------------------------------
      - name: Optimize APK with Zipalign
        shell: bash
        run: |
          set -e

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "zipalign" |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            youtube-original.apk \
            youtube-aligned.apk

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            youtube-aligned.apk

          ls -lh youtube-aligned.apk


      # --------------------------------------------------
      # 9. Patch with Anddea DEV
      # --------------------------------------------------
      - name: Patch YouTube with Anddea DEV
        shell: bash
        run: |
          set -e

          OUTPUT="YT-${YT_VERSION}-Anddea-Dev.apk"

          java -jar tools/revanced-cli.jar \
            -b \
            patch \
            -p tools/anddea-dev.mpp \
            -o "$OUTPUT" \
            youtube-aligned.apk

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: Anddea APK was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PATCHED APK CREATED"
          echo "=========================================="

          ls -lh "$OUTPUT"


      # --------------------------------------------------
      # 10. Verify APK
      # --------------------------------------------------
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          APK="YT-${YT_VERSION}-Anddea-Dev.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK not found."
            exit 1
          fi

          file "$APK"

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "zipalign" |
            sort -V |
            tail -n 1
          )"

          "$ZIPALIGN" -c -v 4 "$APK" || true


      # --------------------------------------------------
      # 11. Upload APK artifact
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-${{ env.YT_VERSION }}-Anddea-Dev
          path: YT-${{ env.YT_VERSION }}-Anddea-Dev.apk
          if-no-files-found: error


      # --------------------------------------------------
      # 12. Upload compatibility log
      # --------------------------------------------------
      - name: Upload compatibility log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anddea-Compatibility-${{ env.YT_VERSION }}
          path: compatible-patches.txt
          if-no-files-found: warn


      # --------------------------------------------------
      # 13. GitHub Beta Release
      # --------------------------------------------------
      - name: Create GitHub Anddea DEV Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ env.YT_VERSION }}-anddea-dev
          name: YT ${{ env.YT_VERSION }} Anddea DEV
          prerelease: true

          body: |
            YouTube ${{ env.YT_VERSION }}

            Patched with latest Anddea DEV patches.

            Architecture:
            ARM64-v8a

            APK source:
            APKMirror

            Optimization:
            Zipaligned

            Patch channel:
            Anddea DEV

          files: |
            YT-${{ env.YT_VERSION }}-Anddea-Dev.apk

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
