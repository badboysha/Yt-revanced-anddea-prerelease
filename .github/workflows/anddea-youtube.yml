name: YouTube 21.13.164 → Anddea DEV → ARM64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      YT_VERSION: "21.13.164"
      APKMD_REPO: "tanishqmanuja/apkmirror-downloader"
      MORPHE_REPO: "MorpheApp/morphe-desktop"
      ANDDEA_REPO: "https://github.com/anddea/revanced-patches"

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ==========================================
      # 3. Download APKMirror downloader
      # ==========================================
      - name: Download APKMirror downloader
        shell: bash
        run: |
          set -e

          mkdir -p tools downloads

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          APKMD_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(.name == "apkmd")
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "ERROR: APKMirror downloader not found."
            curl -fsSL "$API" | jq -r '.assets[].name'
            exit 1
          fi

          curl -fL "$APKMD_URL" -o tools/apkmd
          chmod +x tools/apkmd

          ./tools/apkmd --help


      # ==========================================
      # 4. Download latest stable Morphe Desktop
      # ==========================================
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/${MORPHE_REPO}/releases/latest"

          MORPHE_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$MORPHE_URL" ] || [ "$MORPHE_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop JAR not found."
            curl -fsSL "$API" | jq -r '.assets[].name'
            exit 1
          fi

          curl -fL "$MORPHE_URL" -o tools/morphe-desktop.jar

          echo "Morphe Desktop:"
          ls -lh tools/morphe-desktop.jar


      # ==========================================
      # 5. Check Anddea DEV compatibility
      # ==========================================
      - name: Check Anddea DEV patches
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Anddea DEV compatibility check"
          echo "YouTube: ${YT_VERSION}"
          echo "=========================================="

          java -jar tools/morphe-desktop.jar \
            list-versions \
            --patches "$ANDDEA_REPO" \
            --prerelease \
            -f com.google.android.youtube \
            --include-experimental \
            | tee anddea-versions.txt

          echo ""
          echo "=========================================="
          echo "Available Anddea DEV YouTube versions"
          echo "=========================================="

          cat anddea-versions.txt

          echo ""
          echo "Checking for ${YT_VERSION}..."

          if grep -Fq "${YT_VERSION}" anddea-versions.txt; then
            echo "OK: ${YT_VERSION} is listed by Anddea DEV."
          else
            echo "WARNING:"
            echo "${YT_VERSION} is NOT listed as a common compatible version."
            echo ""
            echo "The patch step will still run."
            echo "Morphe will apply only patches compatible with"
            echo "the supplied APK."
          fi


      # ==========================================
      # 6. Show Anddea DEV YouTube patches
      # ==========================================
      - name: List Anddea DEV YouTube patches
        shell: bash
        run: |
          set -e

          java -jar tools/morphe-desktop.jar \
            list-patches \
            --patches "$ANDDEA_REPO" \
            --prerelease \
            --with-packages \
            --with-versions \
            -f com.google.android.youtube \
            --include-experimental \
            > anddea-patches.txt

          echo "Anddea DEV YouTube patches:"
          cat anddea-patches.txt


      # ==========================================
      # 7. Download YouTube 21.13.164
      # ==========================================
      - name: Download YouTube 21.13.164
        shell: bash
        run: |
          set -e

          rm -rf downloads
          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "youtube-${YT_VERSION}"
              }
            ]
          }
          EOF

          ./tools/apkmd apps.json

          APK="$(
            find downloads \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK was not downloaded."

            echo "Downloaded files:"
            find downloads -type f || true

            exit 1
          fi

          cp "$APK" youtube-original.apk

          echo "Downloaded YouTube APK:"
          ls -lh youtube-original.apk


      # ==========================================
      # 8. Zipalign original APK
      # ==========================================
      - name: Optimize APK with Zipalign
        shell: bash
        run: |
          set -e

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "zipalign" |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          echo "Using:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            youtube-original.apk \
            youtube-aligned.apk

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            youtube-aligned.apk

          echo "Optimized APK:"
          ls -lh youtube-aligned.apk


      # ==========================================
      # 9. Patch with Anddea DEV
      # ==========================================
      - name: Patch YouTube with Anddea DEV
        shell: bash
        run: |
          set -e

          OUTPUT="YT-${YT_VERSION}-Anddea-Dev.apk"

          echo "=========================================="
          echo "PATCHING"
          echo "YouTube: ${YT_VERSION}"
          echo "Patch source: Anddea DEV"
          echo "Architecture: ARM64-v8a"
          echo "=========================================="

          java -jar tools/morphe-desktop.jar \
            patch \
            --patches "$ANDDEA_REPO" \
            --prerelease \
            --striplibs arm64-v8a \
            --bytecode-mode STRIP_SAFE \
            --verify-with-sdk "$ANDROID_HOME" \
            --result-file result.json \
            --out "$OUTPUT" \
            youtube-aligned.apk

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: Patched APK was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PATCH SUCCESS"
          echo "=========================================="

          ls -lh "$OUTPUT"


      # ==========================================
      # 10. Verify final APK
      # ==========================================
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          APK="YT-${YT_VERSION}-Anddea-Dev.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK not found."
            exit 1
          fi

          echo "APK:"
          file "$APK"

          echo ""
          echo "Size:"
          ls -lh "$APK"

          echo ""
          echo "Checking ZIP alignment..."

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "zipalign" |
            sort -V |
            tail -n 1
          )"

          "$ZIPALIGN" -c -v 4 "$APK" || true


      # ==========================================
      # 11. Upload APK artifact
      # ==========================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-${{ env.YT_VERSION }}-Anddea-Dev
          path: YT-${{ env.YT_VERSION }}-Anddea-Dev.apk
          if-no-files-found: error


      # ==========================================
      # 12. Upload patch result
      # ==========================================
      - name: Upload patch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anddea-Result-${{ env.YT_VERSION }}
          path: result.json
          if-no-files-found: warn


      # ==========================================
      # 13. Upload compatibility information
      # ==========================================
      - name: Upload Anddea compatibility logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anddea-Compatibility-${{ env.YT_VERSION }}
          path: |
            anddea-versions.txt
            anddea-patches.txt
          if-no-files-found: warn


      # ==========================================
      # 14. Create GitHub Pre-release
      # ==========================================
      - name: Create GitHub Anddea DEV Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ env.YT_VERSION }}-anddea-dev
          name: YT ${{ env.YT_VERSION }} Anddea DEV
          prerelease: true

          body: |
            YouTube ${{ env.YT_VERSION }}

            Patched with Anddea DEV patches.

            Architecture:
            ARM64-v8a

            APK source:
            APKMirror

            APK optimized:
            Yes

            Zipaligned:
            Yes

            Patch channel:
            Anddea DEV

          files: |
            YT-${{ env.YT_VERSION }}-Anddea-Dev.apk

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
