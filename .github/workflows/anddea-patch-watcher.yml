name: Check Anddea Dev Patch Updates

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check latest Anddea Dev patch
        shell: bash
        run: |
          set -e

          echo "Checking latest Anddea Dev patch..."

          LATEST_PATCH="$(
            curl -fsSL \
              "https://api.github.com/repos/anddea/revanced-patches/releases?per_page=30" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$"))
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$LATEST_PATCH" ] || [ "$LATEST_PATCH" = "null" ]; then
            echo "ERROR: Could not find Anddea Dev patch."
            exit 1
          fi

          LATEST_PATCH="${LATEST_PATCH#v}"

          echo "Latest Anddea Dev patch: $LATEST_PATCH"

          if [ -f ".anddea-patch-version" ]; then
            CURRENT_PATCH="$(cat .anddea-patch-version)"
          else
            CURRENT_PATCH=""
          fi

          echo "Current recorded patch: ${CURRENT_PATCH:-none}"

          if [ "$LATEST_PATCH" = "$CURRENT_PATCH" ]; then
            echo "No new patch."
            exit 0
          fi

          echo "New Anddea Dev patch detected!"
          echo "$CURRENT_PATCH → $LATEST_PATCH"

          echo "$LATEST_PATCH" > .anddea-patch-version

      - name: Commit new patch version
        shell: bash
        run: |
          set -e

          if git diff --quiet .anddea-patch-version; then
            echo "No change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .anddea-patch-version

          git commit \
            -m "chore: update Anddea patch version"

          git push
