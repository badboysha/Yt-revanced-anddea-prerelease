name: Build Anddea YouTube APK

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: anddea-youtube-build
  cancel-in-progress: false

jobs:
  build:
    name: Download, Patch and Release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      YOUTUBE_VERSION: "21.39.525"
      PATCHES_REPO: "https://github.com/anddea/revanced-patches"
      PATCHES_API: "https://api.github.com/repos/anddea/revanced-patches"
      MORPHE_API: "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Android SDK setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      # 4. Install SDK packages separately
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "build-tools;35.0.0"

          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"

          test -x "$ZIPALIGN" || {
            echo "::error::zipalign was not installed."
            exit 1
          }

          test -x "$AAPT" || {
            echo "::error::aapt was not installed."
            exit 1
          }

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

      # 5. Download YouTube from APKMirror
      # APKMD is deliberately not used.
      - name: Download YouTube APK
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: google-inc
          repo: youtube
          version: "21.39.525"
          bundle: false
          filename: youtube-original.apk
          overwrite: true

      # 6. Validate downloaded APK
      - name: Validate Original APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s youtube-original.apk ]; then
            echo "::error::YouTube APK download failed or file is empty."
            exit 1
          fi

          file youtube-original.apk

          "$AAPT" dump badging youtube-original.apk \
            > original-badging.txt

          if ! grep -q "^package: name='com.google.android.youtube'" \
            original-badging.txt; then
            echo "::error::Downloaded file is not the expected YouTube APK."
            cat original-badging.txt
            exit 1
          fi

          if ! grep -q "^package:.*versionName='$YOUTUBE_VERSION'" \
            original-badging.txt; then
            echo "::error::Downloaded YouTube version does not match $YOUTUBE_VERSION."
            cat original-badging.txt
            exit 1
          fi

          echo "YouTube APK validated."

      # 7. Download the latest Morphe Desktop JAR
      - name: Download Morphe Desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p tools

          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$MORPHE_API" \
            -o morphe-release.json

          DOWNLOAD_URL="$(
            jq -r '
              [
                .assets[]
                | select(.name | test("all\\.jar$"; "i"))
                | .browser_download_url
              ][0] // empty
            ' morphe-release.json
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find the Morphe all.jar release asset."
            jq -r '.html_url, (.assets[]?.name)' morphe-release.json
            exit 1
          fi

          echo "Downloading: $DOWNLOAD_URL"

          curl --fail --silent --show-error --location \
            "$DOWNLOAD_URL" \
            -o tools/morphe-desktop.jar

          test -s tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version

      # 8. Align the input APK before patching
      - name: Align Original APK
        shell: bash
        run: |
          set -euo pipefail

          "$ZIPALIGN" -f -v 4 \
            youtube-original.apk \
            youtube-aligned.apk

          "$ZIPALIGN" -c -v 4 youtube-aligned.apk

      # 9. Patch YouTube using Anddea patches
      - name: Patch YouTube
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p output

          java -Xms512m -Xmx5g \
            -jar tools/morphe-desktop.jar \
            patch \
            -p "$PATCHES_REPO" \
            --prerelease \
            -o output/youtube-anddea.apk \
            -r output/result.json \
            --striplibs "arm64-v8a" \
            --bytecode-mode "STRIP_SAFE" \
            youtube-aligned.apk

          if [ ! -s output/youtube-anddea.apk ]; then
            echo "::error::Morphe did not produce the patched APK."
            exit 1
          fi

          echo "Patching command completed."

      # 10. Validate patched APK
      - name: Validate Patched APK
        shell: bash
        run: |
          set -euo pipefail

          APK="output/youtube-anddea.apk"

          "$AAPT" dump badging "$APK" > output/patched-badging.txt

          if ! grep -q "^package: name='com.google.android.youtube'" \
            output/patched-badging.txt; then
            echo "::error::Patched APK has an unexpected package name."
            cat output/patched-badging.txt
            exit 1
          fi

          echo "Patched APK details:"
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:" \
            output/patched-badging.txt || true

          # Check alignment without modifying the signed output.
          "$ZIPALIGN" -c -v 4 "$APK"

          if [ -f output/result.json ]; then
            echo "Morphe result file:"
            cat output/result.json
          fi

          sha256sum "$APK" > output/SHA256SUMS.txt

      # 11. Upload APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anddea-YouTube-${{ env.YOUTUBE_VERSION }}
          path: |
            output/youtube-anddea.apk
            output/SHA256SUMS.txt
            output/result.json
          if-no-files-found: error
          retention-days: 14

      # 12. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: youtube-${{ env.YOUTUBE_VERSION }}-run-${{ github.run_number }}
          name: Anddea YouTube ${{ env.YOUTUBE_VERSION }} Build ${{ github.run_number }}
          body: |
            Automated YouTube patch build.

            - YouTube version: ${{ env.YOUTUBE_VERSION }}
            - Patch repository: ${{ env.PATCHES_REPO }}
            - Architecture: ARM64 (arm64-v8a)
            - Patcher: Morphe Desktop
            - Trigger: ${{ github.event_name }}

            Review the workflow logs and SHA256SUMS.txt before installing.
          files: |
            output/youtube-anddea.apk
            output/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
