name: Build Anddea YouTube APK

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: anddea-youtube-build
  cancel-in-progress: false

jobs:
  build:
    name: Download, Patch and Release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      YOUTUBE_VERSION: "21.39.525"
      PATCHES_REPO: "https://github.com/anddea/revanced-patches"

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Node.js for APKCombo downloader
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      # 5. Install Android tools
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "build-tools;35.0.0"

          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"

          test -x "$ZIPALIGN" || {
            echo "::error::zipalign installation failed."
            exit 1
          }

          test -x "$AAPT" || {
            echo "::error::aapt installation failed."
            exit 1
          }

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

      # 6. Download the exact YouTube version for ARM64
      - name: Download YouTube ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          DOWNLOAD_DIR="$GITHUB_WORKSPACE/downloads"
          INSTALL_DIR="$RUNNER_TEMP/apkcombo"

          mkdir -p "$DOWNLOAD_DIR" "$INSTALL_DIR"

          npm install \
            --prefix "$INSTALL_DIR" \
            --no-audit \
            --no-fund \
            @nirewen/apkcombo-downloader

          cat > "$INSTALL_DIR/download.mjs" <<'JS'
          import { APKComboDownloader } from "@nirewen/apkcombo-downloader";

          const version = process.env.YOUTUBE_VERSION;
          const output = process.env.GITHUB_WORKSPACE + "/downloads";

          const downloader = new APKComboDownloader({
            arch: "arm64-v8a",
            outDir: output
          });

          await downloader.download(
            {
              org: "youtube",
              repo: "com.google.android.youtube"
            },
            {
              version,
              arch: "arm64-v8a",
              type: "apk",
              outFile: "youtube-original",
              outDir: output
            }
          );

          console.log("APKCombo download operation finished.");
          JS

          YOUTUBE_VERSION="$YOUTUBE_VERSION" \
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            node "$INSTALL_DIR/download.mjs"

          echo "Downloaded files:"
          find "$DOWNLOAD_DIR" -maxdepth 3 -type f \
            -printf '%p (%s bytes)\n'

          APK="$(find "$DOWNLOAD_DIR" -maxdepth 3 \
            -type f -iname '*.apk' -size +1M \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was downloaded."
            echo "The requested version may be unavailable on APKCombo."
            exit 1
          fi

          cp "$APK" youtube-original.apk

          test -s youtube-original.apk

      # 7. Validate package and version
      - name: Validate Original APK
        shell: bash
        run: |
          set -euo pipefail

          "$AAPT" dump badging youtube-original.apk \
            > original-badging.txt

          if ! grep -q "^package: name='com.google.android.youtube'" \
            original-badging.txt; then
            echo "::error::Downloaded package is not YouTube."
            cat original-badging.txt
            exit 1
          fi

          if ! grep -q "versionName='$YOUTUBE_VERSION'" \
            original-badging.txt; then
            echo "::error::Downloaded version does not match $YOUTUBE_VERSION."
            cat original-badging.txt
            exit 1
          fi

          echo "Validated YouTube version $YOUTUBE_VERSION."

      # 8. Download latest Morphe Desktop CLI
      - name: Download Morphe Desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p tools

          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest" \
            -o morphe-release.json

          JAR_URL="$(
            jq -r '
              [
                .assets[]
                | select(.name | test("-all\\.jar$"; "i"))
                | .browser_download_url
              ][0] // empty
            ' morphe-release.json
          )"

          if [ -z "$JAR_URL" ]; then
            echo "::error::Morphe all.jar asset was not found."
            jq -r '.html_url, (.assets[]?.name)' morphe-release.json
            exit 1
          fi

          curl --fail --silent --show-error --location \
            "$JAR_URL" \
            -o tools/morphe-desktop.jar

          test -s tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version

      # 9. Align input APK
      - name: Align Original APK
        shell: bash
        run: |
          set -euo pipefail

          "$ZIPALIGN" -f -v 4 \
            youtube-original.apk \
            youtube-aligned.apk

          "$ZIPALIGN" -c -v 4 youtube-aligned.apk

      # 10. Patch using Anddea
      - name: Patch YouTube
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output
          export MORPHE_DATA_DIR="$RUNNER_TEMP/morphe-data"

          java -Xms512m -Xmx5g \
            -jar tools/morphe-desktop.jar \
            patch \
            --patches "$PATCHES_REPO" \
            --prerelease \
            --out "$GITHUB_WORKSPACE/output/youtube-anddea.apk" \
            --result-file "$GITHUB_WORKSPACE/output/result.json" \
            --striplibs "arm64-v8a" \
            --bytecode-mode "STRIP_SAFE" \
            --verify-with-sdk "$ANDROID_HOME" \
            "$GITHUB_WORKSPACE/youtube-aligned.apk"

          if [ ! -s output/youtube-anddea.apk ]; then
            echo "::error::Patched APK was not generated."
            exit 1
          fi

      # 11. Validate final APK
      - name: Validate Patched APK
        shell: bash
        run: |
          set -euo pipefail

          APK="output/youtube-anddea.apk"

          "$AAPT" dump badging "$APK" \
            > output/patched-badging.txt

          if ! grep -q "^package: name='com.google.android.youtube'" \
            output/patched-badging.txt; then
            echo "::error::Invalid output package."
            cat output/patched-badging.txt
            exit 1
          fi

          "$ZIPALIGN" -c -v 4 "$APK"

          sha256sum "$APK" > output/SHA256SUMS.txt

          echo "Final APK validated."
          grep "^package:" output/patched-badging.txt

          if [ -f output/result.json ]; then
            cat output/result.json
          fi

      # 12. Upload artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anddea-YouTube-ARM64-${{ env.YOUTUBE_VERSION }}
          path: |
            output/youtube-anddea.apk
            output/SHA256SUMS.txt
            output/result.json
          if-no-files-found: error
          retention-days: 14

      # 13. Create GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: youtube-${{ env.YOUTUBE_VERSION }}-run-${{ github.run_number }}
          name: Anddea YouTube ARM64 ${{ env.YOUTUBE_VERSION }} Build ${{ github.run_number }}
          body: |
            Automated YouTube patch build.

            YouTube version: ${{ env.YOUTUBE_VERSION }}
            Architecture: arm64-v8a
            Patch repository: ${{ env.PATCHES_REPO }}
            Patcher: Morphe Desktop

            Check SHA256SUMS.txt and workflow logs before installing.
          files: |
            output/youtube-anddea.apk
            output/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
