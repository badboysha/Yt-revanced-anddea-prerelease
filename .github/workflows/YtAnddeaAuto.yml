name: Anddea Beta - YouTube 21.39.525 ARM64

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: anddea-youtube-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APKMD_REPO: tanishqmanuja/apkmirror-downloader
      MORPHE_REPO: MorpheApp/morphe-desktop
      PATCHES_REPO: https://github.com/anddea/revanced-patches
      YT_VERSION: "21.39.525"

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Detect Anddea development patch
      # -------------------------------------------------------
      - name: Check Anddea Dev Patch
        id: patch_check
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://api.github.com/repos/anddea/revanced-patches/releases?per_page=100" \
            -o releases.json

          PATCH_VERSION="$(
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(
                    .tag_name
                    | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$")
                  )
              ]
              | sort_by(.published_at)
              | last
              | .tag_name // empty
            ' releases.json
          )"

          if [ -z "$PATCH_VERSION" ]; then
            echo "::error::No matching Anddea Dev release found."
            exit 1
          fi

          PATCH_VERSION="${PATCH_VERSION#v}"

          echo "Detected patch: $PATCH_VERSION"
          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_ENV"

          CURRENT_PATCH=""

          if [ -f .anddea-patch-version ]; then
            CURRENT_PATCH="$(tr -d '[:space:]' < .anddea-patch-version)"
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PATCH_VERSION" = "$CURRENT_PATCH" ]; then
            echo "No new patch detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New patch detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------
      # Java 21
      # -------------------------------------------------------
      - name: Setup Java 21
        if: steps.patch_check.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # -------------------------------------------------------
      # ANDROID SDK - FIXED SETUP
      # -------------------------------------------------------
      - name: Setup Android SDK
        if: steps.patch_check.outputs.changed == 'true'
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools,build-tools;35.0.0"

      # -------------------------------------------------------
      # Verify SDK and locate tools
      # -------------------------------------------------------
      - name: Verify Android SDK
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is missing."
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager is not on PATH."
            exit 1
          fi

          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "::error::zipalign is missing: $ZIPALIGN"
            exit 1
          fi

          if [ ! -x "$AAPT" ]; then
            echo "::error::aapt is missing: $AAPT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          echo "SDK root: $SDK_ROOT"
          echo "SDK Manager: $SDKMANAGER"
          echo "Build Tools: $BUILD_TOOLS"

          "$ZIPALIGN" -h || true

          echo "Android SDK verification successful."

      # -------------------------------------------------------
      # Download APKMD
      # -------------------------------------------------------
      - name: Download APKMD
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools downloads

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          curl -fsSL "$API" -o apkmd-release.json

          APKMD_URL="$(
            jq -r '
              .assets[]
              | select(.name == "apkmd")
              | .browser_download_url
            ' apkmd-release.json | head -n 1
          )"

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "::error::APKMD binary not found."
            jq -r '.assets[].name' apkmd-release.json
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            "$APKMD_URL" \
            -o tools/apkmd

          chmod +x tools/apkmd
          ./tools/apkmd --help

      # -------------------------------------------------------
      # Download Morphe Desktop
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${MORPHE_REPO}/releases/latest"

          curl -fsSL "$API" -o morphe-release.json

          MORPHE_URL="$(
            jq -r '
              .assets[]
              | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              | .browser_download_url
            ' morphe-release.json | head -n 1
          )"

          if [ -z "$MORPHE_URL" ] || [ "$MORPHE_URL" = "null" ]; then
            echo "::error::Morphe Desktop JAR not found."
            jq -r '.assets[].name' morphe-release.json
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            "$MORPHE_URL" \
            -o tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version

      # -------------------------------------------------------
      # Download YouTube APK with retries
      # -------------------------------------------------------
      - name: Download YouTube from APKMirror
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf downloads
          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "youtube-${YT_VERSION}"
              }
            ]
          }
          EOF

          DOWNLOAD_SUCCESS=false

          for attempt in 1 2 3; do
            echo "APK download attempt $attempt/3"

            find downloads -mindepth 1 -delete

            if ./tools/apkmd apps.json; then
              mapfile -t APK_FILES < <(
                find downloads -type f -name '*.apk' | sort
              )

              if [ "${#APK_FILES[@]}" -eq 1 ] &&
                 [ -s "${APK_FILES[0]}" ]; then
                cp "${APK_FILES[0]}" youtube-original.apk
                DOWNLOAD_SUCCESS=true
                break
              fi

              echo "Expected one APK; found ${#APK_FILES[@]}."
            else
              echo "APKMD download failed."
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done

          if [ "$DOWNLOAD_SUCCESS" != "true" ]; then
            echo "::error::YouTube APK download failed after three attempts."
            exit 1
          fi

          ls -lh youtube-original.apk

      # -------------------------------------------------------
      # Verify original APK
      # -------------------------------------------------------
      - name: Verify Original YouTube APK
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s youtube-original.apk

          "$AAPT" dump badging youtube-original.apk \
            | tee youtube-metadata.txt

          grep -Fq \
            "package: name='com.google.android.youtube'" \
            youtube-metadata.txt

          grep -Fq \
            "versionName='${YT_VERSION}'" \
            youtube-metadata.txt

          echo "Original YouTube APK verified."

      # -------------------------------------------------------
      # Patch YouTube
      # -------------------------------------------------------
      - name: Patch YouTube with Anddea Dev
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          FINAL_APK="YT-${YT_VERSION}-Anddea-Beta-${PATCH_VERSION}.apk"

          java -jar tools/morphe-desktop.jar \
            patch \
            -p "$PATCHES_REPO" \
            --prerelease \
            -o "$FINAL_APK" \
            -r result.json \
            --striplibs arm64-v8a \
            --bytecode-mode STRIP_SAFE \
            youtube-original.apk

          if [ ! -s "$FINAL_APK" ]; then
            echo "::error::Patched APK was not created."
            exit 1
          fi

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Verify patch result
      # -------------------------------------------------------
      - name: Verify Patch Result
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s result.json ]; then
            echo "::error::Patch result JSON is missing."
            exit 1
          fi

          jq -e 'type == "object"' result.json >/dev/null

          echo "Patch result JSON is valid."
          cat result.json

      # -------------------------------------------------------
      # Zipalign final APK
      # -------------------------------------------------------
      - name: Zipalign Final APK
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED_APK="aligned-${FINAL_APK}"

          "$ZIPALIGN" \
            -P 16 \
            -f \
            4 \
            "$FINAL_APK" \
            "$ALIGNED_APK"

          "$ZIPALIGN" -c -P 16 -v 4 "$ALIGNED_APK"

          mv "$ALIGNED_APK" "$FINAL_APK"

          echo "Final APK aligned successfully."
          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Verify final APK
      # -------------------------------------------------------
      - name: Verify Final APK
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s "$FINAL_APK"

          "$AAPT" dump badging "$FINAL_APK" \
            | tee final-apk-metadata.txt

          grep -Fq \
            "package: name='com.google.android.youtube'" \
            final-apk-metadata.txt

          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL_APK"

          echo "Final APK verification successful."

      # -------------------------------------------------------
      # Upload APK artifact
      # -------------------------------------------------------
      - name: Upload APK Artifact
        if: steps.patch_check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YT-${{ env.YT_VERSION }}-Anddea-Beta-${{ env.PATCH_VERSION }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 14

      # -------------------------------------------------------
      # Upload patch result
      # -------------------------------------------------------
      - name: Upload Patch Result
        if: steps.patch_check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Anddea-Result-${{ env.YT_VERSION }}-${{ env.PATCH_VERSION }}
          path: result.json
          if-no-files-found: error
          retention-days: 14

      # -------------------------------------------------------
      # Create or update release
      # -------------------------------------------------------
      - name: Create GitHub Anddea Beta Release
        if: steps.patch_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ env.YT_VERSION }}-anddea-beta-${{ env.PATCH_VERSION }}
          name: YouTube ${{ env.YT_VERSION }} Anddea Beta - ${{ env.PATCH_VERSION }}
          prerelease: false
          body: |
            YouTube: ${{ env.YT_VERSION }}

            Patch repository: anddea/revanced-patches
            Anddea Dev patch: ${{ env.PATCH_VERSION }}

            Architecture: ARM64-v8a
            Source: APKMirror
            Build: GitHub Actions

            APK: Zipaligned and verified

          files: ${{ env.FINAL_APK }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Save successfully released patch version
      # -------------------------------------------------------
      - name: Save Anddea Patch Version
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "$PATCH_VERSION" > .anddea-patch-version

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .anddea-patch-version

          if git diff --cached --quiet; then
            echo "Patch version already recorded."
            exit 0
          fi

          git commit \
            -m "chore: update Anddea patch to ${PATCH_VERSION}"

          git push
