name: Anddea Beta - YouTube 21.39.525 ARM64

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: anddea-youtube-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APKMD_REPO: "tanishqmanuja/apkmirror-downloader"
      MORPHE_REPO: "MorpheApp/morphe-desktop"
      PATCHES_REPO: "https://github.com/anddea/revanced-patches"
      YT_VERSION: "21.39.525"

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Detect latest Anddea development patch
      # -------------------------------------------------------
      - name: Check Anddea Dev Patch
        id: patch_check
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Anddea development releases..."

          curl -fsSL \
            "https://api.github.com/repos/anddea/revanced-patches/releases?per_page=100" \
            -o releases.json

          PATCH_VERSION="$(
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(
                    .tag_name
                    | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$")
                  )
              ]
              | sort_by(.published_at)
              | last
              | .tag_name // empty
            ' releases.json
          )"

          if [ -z "$PATCH_VERSION" ]; then
            echo "ERROR: No matching Anddea development release found."
            echo "Check the repository release tags."
            exit 1
          fi

          PATCH_VERSION="${PATCH_VERSION#v}"

          echo "Latest patch: $PATCH_VERSION"
          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_ENV"

          CURRENT_PATCH=""

          if [ -f .anddea-patch-version ]; then
            CURRENT_PATCH="$(tr -d '[:space:]' < .anddea-patch-version)"
          fi

          echo "Previously built patch: ${CURRENT_PATCH:-none}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual build requested."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PATCH_VERSION" = "$CURRENT_PATCH" ]; then
            echo "No new patch. Skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New patch detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------
      # Setup Java
      # -------------------------------------------------------
      - name: Setup Java 21
        if: steps.patch_check.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # -------------------------------------------------------
      # Setup Android SDK
      # -------------------------------------------------------
      - name: Setup Android SDK
        if: steps.patch_check.outputs.changed == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "build-tools;35.0.0"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          test -x "$ZIPALIGN"

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Download APKMirror downloader
      # -------------------------------------------------------
      - name: Download APKMD
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools downloads

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          curl -fsSL "$API" -o apkmd-release.json

          APKMD_URL="$(
            jq -r '
              .assets[]
              | select(.name == "apkmd")
              | .browser_download_url
            ' apkmd-release.json | head -n 1
          )"

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "ERROR: APKMD binary not found."
            jq -r '.assets[].name' apkmd-release.json
            exit 1
          fi

          curl --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            -fL "$APKMD_URL" \
            -o tools/apkmd

          chmod +x tools/apkmd

          ./tools/apkmd --help

      # -------------------------------------------------------
      # Download Morphe Desktop
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${MORPHE_REPO}/releases/latest"

          curl -fsSL "$API" -o morphe-release.json

          MORPHE_URL="$(
            jq -r '
              .assets[]
              | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              | .browser_download_url
            ' morphe-release.json | head -n 1
          )"

          if [ -z "$MORPHE_URL" ] || [ "$MORPHE_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop JAR not found."
            jq -r '.assets[].name' morphe-release.json
            exit 1
          fi

          curl --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            -fL "$MORPHE_URL" \
            -o tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version

      # -------------------------------------------------------
      # Verify compatible patch versions
      # -------------------------------------------------------
      - name: Check YouTube Patch Compatibility
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          java -jar tools/morphe-desktop.jar \
            list-versions \
            --patches "$PATCHES_REPO" \
            --prerelease \
            --filter-package-names com.google.android.youtube \
            | tee compatible-versions.txt

          if ! grep -Fq "$YT_VERSION" compatible-versions.txt; then
            echo "ERROR: YouTube $YT_VERSION was not found in the"
            echo "development patches' compatible-version list."
            echo "Review compatible-versions.txt before proceeding."
            exit 1
          fi

      # -------------------------------------------------------
      # Download YouTube APK with retries
      # -------------------------------------------------------
      - name: Download YouTube from APKMirror
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf downloads
          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "youtube-${YT_VERSION}"
              }
            ]
          }
          EOF

          echo "Requested YouTube version: $YT_VERSION"

          DOWNLOAD_SUCCESS=false

          for attempt in 1 2 3; do
            echo ""
            echo "========================================="
            echo "Download attempt $attempt/3"
            echo "========================================="

            rm -f downloads/*

            if ./tools/apkmd apps.json; then
              APK_COUNT="$(
                find downloads -type f -name '*.apk' | wc -l
              )"

              if [ "$APK_COUNT" -eq 1 ]; then
                APK="$(find downloads -type f -name '*.apk' -print -quit)"

                if [ -s "$APK" ]; then
                  DOWNLOAD_SUCCESS=true
                  break
                fi
              else
                echo "Expected one APK, found: $APK_COUNT"
              fi
            else
              echo "APKMD failed on attempt $attempt."
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 20 seconds before retry..."
              sleep 20
            fi
          done

          if [ "$DOWNLOAD_SUCCESS" != "true" ]; then
            echo ""
            echo "ERROR: APKMirror download failed after 3 attempts."
            echo "APKMD could not obtain a valid APK."
            echo "Inspect the APKMirror page and redirect response."
            exit 1
          fi

          cp "$APK" youtube-original.apk

          echo "Downloaded APK:"
          ls -lh youtube-original.apk

      # -------------------------------------------------------
      # Verify APK structure and package/version
      # -------------------------------------------------------
      - name: Verify Original YouTube APK
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s youtube-original.apk

          sudo apt-get update
          sudo apt-get install -y aapt

          aapt dump badging youtube-original.apk \
            | tee youtube-metadata.txt

          grep -Fq \
            "package: name='com.google.android.youtube'" \
            youtube-metadata.txt

          grep -Fq "versionName='${YT_VERSION}'" \
            youtube-metadata.txt

          echo "Original APK package and version verified."

      # -------------------------------------------------------
      # Patch YouTube with Anddea Dev
      # -------------------------------------------------------
      - name: Patch YouTube with Anddea Dev
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          FINAL_APK="YT-${YT_VERSION}-Anddea-Beta-${PATCH_VERSION}.apk"

          java -jar tools/morphe-desktop.jar \
            patch \
            --patches "$PATCHES_REPO" \
            --prerelease \
            --out "$FINAL_APK" \
            --result-file result.json \
            --striplibs arm64-v8a \
            --bytecode-mode STRIP_SAFE \
            youtube-original.apk

          if [ ! -s "$FINAL_APK" ]; then
            echo "ERROR: Patched APK was not created."
            exit 1
          fi

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Verify patch result
      # -------------------------------------------------------
      - name: Verify Patch Result
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s result.json ]; then
            echo "ERROR: Patch result JSON is missing."
            exit 1
          fi

          cat result.json

          jq -e 'type == "object"' result.json >/dev/null

          if jq -e '.. | objects | select(has("success")) | .success == false' \
            result.json >/dev/null; then
            echo "ERROR: Patch result reports a failure."
            exit 1
          fi

          echo "Patch result JSON validated."

      # -------------------------------------------------------
      # Zipalign final APK
      # -------------------------------------------------------
      - name: Zipalign Final APK
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED_APK="aligned-${FINAL_APK}"

          "$ZIPALIGN" \
            -P 16 \
            -f \
            4 \
            "$FINAL_APK" \
            "$ALIGNED_APK"

          "$ZIPALIGN" -c -P 16 -v 4 "$ALIGNED_APK"

          mv "$ALIGNED_APK" "$FINAL_APK"

          echo "Final APK aligned successfully."
          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Final APK verification
      # -------------------------------------------------------
      - name: Verify Final APK
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s "$FINAL_APK"

          aapt dump badging "$FINAL_APK" \
            | tee final-apk-metadata.txt

          grep -Fq \
            "package: name='com.google.android.youtube'" \
            final-apk-metadata.txt

          echo "Final APK verification completed."

      # -------------------------------------------------------
      # Upload APK artifact
      # -------------------------------------------------------
      - name: Upload APK Artifact
        if: steps.patch_check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YT-${{ env.YT_VERSION }}-Anddea-Beta-${{ env.PATCH_VERSION }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 14

      # -------------------------------------------------------
      # Upload patch result
      # -------------------------------------------------------
      - name: Upload Patch Result
        if: steps.patch_check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Anddea-Result-${{ env.YT_VERSION }}-${{ env.PATCH_VERSION }}
          path: result.json
          if-no-files-found: error
          retention-days: 14

      # -------------------------------------------------------
      # Create GitHub Release
      # -------------------------------------------------------
      - name: Create GitHub Anddea Beta Release
        if: steps.patch_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ env.YT_VERSION }}-anddea-beta-${{ env.PATCH_VERSION }}
          name: YouTube ${{ env.YT_VERSION }} Anddea Beta - ${{ env.PATCH_VERSION }}
          prerelease: false
          body: |
            YouTube Version: ${{ env.YT_VERSION }}

            Patch Repository: anddea/revanced-patches
            Anddea Development Patch: ${{ env.PATCH_VERSION }}

            Architecture: ARM64-v8a

            Source: APKMirror
            Build: GitHub Actions
            APK: Zipaligned and verified

          files: ${{ env.FINAL_APK }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Save patch version only after successful release
      # -------------------------------------------------------
      - name: Save Anddea Patch Version
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "$PATCH_VERSION" > .anddea-patch-version

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .anddea-patch-version

          if git diff --cached --quiet; then
            echo "Patch version already recorded."
            exit 0
          fi

          git commit \
            -m "chore: update Anddea patch to ${PATCH_VERSION}"

          git push
