name: Build Anddea YouTube APK

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: anddea-youtube-build
  cancel-in-progress: false

jobs:
  build:
    name: Download, Patch and Release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      YOUTUBE_VERSION: "21.39.525"
      PATCHES_REPO: "https://github.com/anddea/revanced-patches"

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      # 4. Install SDK packages separately
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "build-tools;35.0.0"

          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"

          test -x "$ZIPALIGN" || {
            echo "::error::zipalign not found."
            exit 1
          }

          test -x "$AAPT" || {
            echo "::error::aapt not found."
            exit 1
          }

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

      # 5. Download ARM64-compatible APKMirror bundle
      - name: Download YouTube Bundle
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: google-inc
          repo: youtube
          version: "21.39.525"
          bundle: true
          filename: youtube-original.apkm
          overwrite: true

      # 6. Validate downloaded bundle
      - name: Validate YouTube Bundle
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s youtube-original.apkm ]; then
            echo "::error::YouTube bundle was not downloaded."
            exit 1
          fi

          if ! unzip -t youtube-original.apkm; then
            echo "::error::Downloaded bundle is not a valid ZIP/APKM file."
            exit 1
          fi

          echo "Bundle contents:"
          unzip -Z1 youtube-original.apkm | head -n 60

      # 7. Download latest Morphe Desktop JAR
      - name: Download Morphe Desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p tools

          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest" \
            -o morphe-release.json

          DOWNLOAD_URL="$(
            jq -r '
              [
                .assets[]
                | select(.name | test("-all\\.jar$"; "i"))
                | .browser_download_url
              ][0] // empty
            ' morphe-release.json
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Morphe all.jar asset was not found."
            jq -r '.html_url, (.assets[]?.name)' morphe-release.json
            exit 1
          fi

          echo "Downloading Morphe Desktop."

          curl --fail --silent --show-error --location \
            "$DOWNLOAD_URL" \
            -o tools/morphe-desktop.jar

          test -s tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version

      # 8. Patch YouTube using Anddea patches
      - name: Patch YouTube
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          java -Xms512m -Xmx5g \
            -jar tools/morphe-desktop.jar \
            patch \
            -p "$PATCHES_REPO" \
            --prerelease \
            -o output/youtube-anddea.apk \
            -r output/result.json \
            --striplibs "arm64-v8a" \
            --bytecode-mode "STRIP_SAFE" \
            youtube-original.apkm

          if [ ! -s output/youtube-anddea.apk ]; then
            echo "::error::Morphe did not produce the output APK."
            exit 1
          fi

      # 9. Validate patched APK
      - name: Validate Patched APK
        shell: bash
        run: |
          set -euo pipefail

          APK="output/youtube-anddea.apk"

          "$AAPT" dump badging "$APK" \
            > output/patched-badging.txt

          if ! grep -q "^package: name='com.google.android.youtube'" \
            output/patched-badging.txt; then
            echo "::error::Output is not the expected YouTube APK."
            cat output/patched-badging.txt
            exit 1
          fi

          echo "Verified package:"
          grep "^package:" output/patched-badging.txt

          # Morphe normally aligns and signs its patched output.
          "$ZIPALIGN" -c -v 4 "$APK"

          sha256sum "$APK" > output/SHA256SUMS.txt

          if [ -f output/result.json ]; then
            echo "Patch result:"
            cat output/result.json
          fi

      # 10. Upload workflow artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anddea-YouTube-ARM64-${{ env.YOUTUBE_VERSION }}
          path: |
            output/youtube-anddea.apk
            output/SHA256SUMS.txt
            output/result.json
          if-no-files-found: error
          retention-days: 14

      # 11. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: youtube-${{ env.YOUTUBE_VERSION }}-run-${{ github.run_number }}
          name: Anddea YouTube ARM64 ${{ env.YOUTUBE_VERSION }} Build ${{ github.run_number }}
          body: |
            Automated Anddea YouTube build.

            YouTube version: ${{ env.YOUTUBE_VERSION }}
            Architecture target: arm64-v8a
            Patches: ${{ env.PATCHES_REPO }}
            Patcher: Morphe Desktop

            Check the workflow logs and SHA256SUMS.txt before installation.
          files: |
            output/youtube-anddea.apk
            output/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
